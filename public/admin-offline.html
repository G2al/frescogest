<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#18181b">
    <title>Gestionale offline · Il Paradiso della Frutta</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#09090b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,520px);padding:42px 32px;text-align:center;border:1px solid #3f3f46;border-radius:24px;background:#18181b;box-shadow:0 24px 70px rgba(0,0,0,.45)}img{display:block;width:190px;max-width:64%;margin:0 auto 30px}h1{margin:0 0 12px;font-size:clamp(28px,8vw,44px)}p{margin:0 0 28px;color:#a1a1aa;line-height:1.6}button{border:0;border-radius:10px;padding:14px 24px;background:#fff;color:#18181b;font:inherit;font-weight:800;cursor:pointer}
    </style>
</head>
<body>
    <main class="card">
        <img src="/assets/images/new-logo-white.png" alt="Il Paradiso della Frutta">
        <h1>Gestionale offline</h1>
        <p>Serve una connessione attiva per proteggere e mantenere aggiornati ordini, clienti e dati amministrativi.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
</body>
</html>
