<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Connessione assente · Il Paradiso della Frutta</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5faf7;color:#073f35;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,520px);padding:42px 32px;text-align:center;border:1px solid #cfe3db;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(7,63,53,.12)}img{display:block;width:180px;max-width:60%;margin:0 auto 28px}h1{margin:0 0 12px;font-size:clamp(30px,8vw,48px)}p{margin:0 0 28px;color:#55726c;line-height:1.6}button{border:0;border-radius:999px;padding:15px 26px;background:#078466;color:#fff;font:inherit;font-weight:800;cursor:pointer}
    </style>
</head>
<body>
    <main class="card">
        <img src="/assets/images/new-logo-primary.png" alt="Il Paradiso della Frutta">
        <h1>Sei offline</h1>
        <p>Controlla la connessione e riprova. Catalogo, carrello e ordini saranno nuovamente disponibili appena torni online.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
</body>
</html>
